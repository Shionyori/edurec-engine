[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edurec-engine"
version = "0.1.0"
description = "教育资源推荐模型引擎"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# 知识生成服务（scripts/kg_server.py）的最小依赖。
# 研究脚本（src/kg/research/）还需要 gensim / wikipedia2vec / nltk / matplotlib
# 等，未列入默认安装；按需自行安装。
kg = ["rdflib>=6.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
# research/ 是一次性脚本，不进入安装包（不在运行时路径上）
exclude = ["kg.research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
